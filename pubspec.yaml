name: expense_tracker
description: Offline Android income and expense tracker with optional per-month backup to your own Google Drive.
publish_to: 'none'
version: 1.5.0+11
repository: https://github.com/Zierch/expense_tracker
issue_tracker: https://github.com/Zierch/expense_tracker/issues

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.22
  path_provider: ^2.1.2
  path: ^1.9.0
  riverpod_annotation: ^2.3.5
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.0
  intl: ^0.19.0
  freezed_annotation: ^2.4.1
  fl_chart: ^0.68.0
  json_annotation: ^4.9.0
  google_sign_in: ^7.2.0
  http: ^1.2.0
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  pdf: ^3.11.0
  printing: ^5.13.0
  # Pinned while flutter/packages#194649 is open: the 2.5.x implementation of this
  # package calls its Kotlin code through JNI, and R8 (on by default in release
  # builds) renames kotlin.coroutines.Continuation, so the bound name no longer
  # exists — exactly what happened in release v1.2.0 (splash that never ends).
  # The pre-2.5 implementation does not use JNI and works under R8 as-is.
  # "shared_preferences" up until the latest version still pins to this old
  # implementation without loss of functionality.
  shared_preferences_android: '>=2.4.28 <2.5.0'
  # Same generational split, and here it also decides whether the Android build
  # needs the NDK: 2.3.x reaches Android through the `jni` packages, which pull in
  # a native module and, with it, an NDK download at build time (the first CI
  # release run failed on a corrupt NDK archive, before any Dart was compiled).
  # 2.2.23 is the last release without that layer.
  path_provider_android: '>=2.2.23 <2.3.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true