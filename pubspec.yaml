name: expense_tracker
description: Offline Android income and expense tracker with optional per-month backup to your own Google Drive.
publish_to: 'none'
version: 1.2.0+4
repository: https://github.com/Zierch/expense_tracker
issue_tracker: https://github.com/Zierch/expense_tracker/issues

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.22
  path_provider: ^2.1.2
  path: ^1.9.0
  riverpod_annotation: ^2.3.5
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.0
  intl: ^0.19.0
  freezed_annotation: ^2.4.1
  fl_chart: ^0.68.0
  json_annotation: ^4.9.0
  google_sign_in: ^7.2.0
  http: ^1.2.0
  shared_preferences: ^2.2.3
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true