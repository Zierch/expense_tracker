# Deploys the Flutter web build to Vercel.
#
# Kept separate from release.yml on purpose: that workflow owns the Android
# signing key and only runs for version tags. A web deploy has no APK, no key and
# no tag — it runs on main and on demand.

name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'vercel.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      # The anon key is public by design: RLS is what confines each user to
      # their own rows. The service role key must never appear here.
      - name: Build web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      # Vercel has no Flutter SDK, so it never builds the app. The project is
      # configured as static with no build command; `vercel.json` in the upload
      # adds the SPA rewrite so /statistics survives a refresh.
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          cp vercel.json build/web/vercel.json
          npm install --global vercel
          cd build/web
          vercel deploy --prod --yes \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID" \
            --project "$VERCEL_PROJECT_ID"
