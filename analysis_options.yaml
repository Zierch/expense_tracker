analyzer:
  exclude:
    - build/**
    - android/**
    # Generated by build_runner and committed on purpose (README.md -> "Generated
    # code"). Their contents follow whichever version of the generator produced
    # them rather than this project's lint configuration, so analysing them
    # reports drift that nobody can fix by hand.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - always_declare_return_types
    - always_put_required_named_parameters_first
    - avoid_bool_literals_in_conditional_expressions
    - avoid_empty_else
    - avoid_relative_lib_imports
    - avoid_return_types_on_setters
    - avoid_unnecessary_containers
    - avoid_void_async
    - prefer_const_constructors
    - prefer_const_literals_to_create_immutables
    - prefer_final_locals
    - prefer_single_quotes
    - unnecessary_await_in_return
    - unnecessary_parenthesis
    - use_key_in_widget_constructors