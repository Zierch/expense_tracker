org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin's incremental compilation keeps its state in memory-mapped .tab files
# under build/<module>/kotlin/. On this toolchain (Kotlin 2.4.0 + Gradle 9.3.1)
# the daemon fails to close those files --
#   "Could not close incremental caches ... class-fq-name-to-source.tab"
# -- which aborts :google_sign_in_android:compileDebugKotlin even after
# `flutter clean` and a daemon restart. Disabling incremental compilation skips
# that machinery entirely. The cost is small here: only a few plugin modules
# contain Kotlin sources, so a full Kotlin recompile adds seconds, not minutes.
kotlin.incremental=false
